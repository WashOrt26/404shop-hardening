server {    
    server_tokens off;  # Oculta la versión de Nginx para mayor seguridad
    
    listen 80;
    server_name 192.168.1.138 localhost;

    # Redirección obligatoria de todo el tráfico HTTP no seguro a HTTPS
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name 192.168.1.138 localhost;

    # Rutas de los certificados dentro del contenedor
    ssl_certificate /etc/nginx/certs/selfsigned.crt;
    ssl_certificate_key /etc/nginx/certs/selfsigned.key;

    # Protocolos y cifrados seguros
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    # Cabeceras de seguridad HTTP
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    #add_header X-Frame-Options "DENY" always;
    #add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;

    # Proxy inverso hacia el contenedor de Django (backend)
    location / {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Servir archivos estáticos recolectados
    location /static/ {
        alias /app/staticfiles/;
    }

    # Servir archivos multimedia (imágenes)
    location /media/ {
        alias /app/media/;
    }


}