
services:
  # Base de datos aislada
  db:
    image: postgres:15
    container_name: postgres_db
    restart: always
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - backend_network

  # Backend (Django con Gunicorn)
  backend:
    build:
      context: ./backend
    container_name: django_backend
    restart: always
    command: gunicorn config.wsgi:application --bind 0.0.0.0:8000
    volumes:
      - static_volume:/app/staticfiles
      - media_volume:/app/media
    env_file:
      - ./backend/.env
    depends_on:
      - db
    networks:
      - backend_network
      - frontend_network

  # NUEVO: Frontend (React / Vite compilado)
  frontend:
    build:
      context: ./frontend
    container_name: react_frontend
    restart: always
    networks:
      - frontend_network

  # Proxy inverso (Nginx unificado)
  nginx:
    image: nginx:alpine
    container_name: 404shop_proxy
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro
      - static_volume:/app/staticfiles:ro
      - media_volume:/app/media:ro
    depends_on:
      - backend
      - frontend
    networks:
      - frontend_network

# Segmentacion o aislamiento de redes
networks:
  backend_network:
    internal: true
  frontend_network:

volumes:
  postgres_data:
  static_volume:
  media_volume:
  certs_volume: